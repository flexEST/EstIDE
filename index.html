<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EST HTML Compiler</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #1c2128;
      --border: #30363d;
      --text: #c9d1d9;
      --text-strong: #e6edf3;
      --muted: #8b949e;
      --faint: #484f58;
      --btn: #21262d;
      --btn-hover: #30363d;
      --accent: #58a6ff;
      --editor-bg: #0d1117;
      --gutter-bg: #0d1117;
      --gutter-text: #6e7681;
      --shadow: rgba(0, 0, 0, 0.4);
      --match: rgba(210, 153, 34, 0.35);
      --match-current: rgba(240, 136, 62, 0.7);
      --pin-bg: rgba(248, 81, 73, 0.18);
      --pin-dot: #f85149;
      --caret-line: rgba(110, 118, 129, 0.12);
    }

    html[data-theme="light"] {
      --bg: #f3f4f6;
      --panel: #ffffff;
      --panel-2: #f6f8fa;
      --border: #d0d7de;
      --text: #24292f;
      --text-strong: #1f2328;
      --muted: #57606a;
      --faint: #8c959f;
      --btn: #f3f4f6;
      --btn-hover: #e5e7eb;
      --accent: #0969da;
      --editor-bg: #ffffff;
      --gutter-bg: #f6f8fa;
      --gutter-text: #8c959f;
      --shadow: rgba(140, 149, 159, 0.25);
      --match: rgba(255, 223, 93, 0.6);
      --match-current: rgba(255, 150, 50, 0.65);
      --pin-bg: rgba(255, 129, 130, 0.22);
      --pin-dot: #d1242f;
      --caret-line: rgba(140, 149, 159, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    button { font-family: inherit; }

    /* ---------- Top header ---------- */
    .header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.3px;
      flex-shrink: 0;
      gap: 12px;
    }
    .header .title { display: flex; align-items: center; gap: 8px; }
    .header .tag {
      background: var(--btn);
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--muted);
      border: 1px solid var(--border);
      font-style: normal;
    }
    .header .right { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--btn);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 12px;
      border-radius: 24px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s ease;
      white-space: nowrap;
    }
    .btn:hover { background: var(--btn-hover); border-color: var(--muted); color: var(--text-strong); }
    .btn:active { transform: scale(.96); }
    .btn.copied { background: #238636; border-color: #2ea043; color: #fff; }
    .btn.icon { padding: 5px 8px; }
    .btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ---------- Layout ---------- */
    .compiler {
      display: flex;
      flex: 1;
      overflow: hidden;
      padding: 12px;
      gap: 12px;
      min-height: 0;
    }

    .pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 8px 24px var(--shadow);
      min-width: 0;
      min-height: 0;
    }

    .pane.fs {
      position: fixed;
      inset: 0;
      z-index: 1000;
      border-radius: 0;
      border: none;
    }

    .pane-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      flex-shrink: 0;
    }
    .pane-header .left, .pane-header .actions { display: flex; align-items: center; gap: 8px; }
    .pane-header .actions { flex-wrap: wrap; justify-content: flex-end; }

    .dot { width: 10px; height: 10px; border-radius: 50%; background: #f78166; display: inline-block; }
    .dot.green { background: #3fb950; }
    .dot.yellow { background: #d29922; }

    /* ---------- Search bar ---------- */
    .searchbar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .searchbar .field {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--editor-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 8px;
    }
    .searchbar .field:focus-within { border-color: var(--accent); }
    .searchbar svg { color: var(--muted); flex-shrink: 0; }
    #search {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-strong);
      font-size: 13px;
      padding: 6px 0;
    }
    #search::placeholder { color: var(--faint); }
    #searchCount { font-size: 12px; color: var(--muted); min-width: 52px; text-align: right; }
    #searchCount.none { color: var(--pin-dot); }

    /* ---------- Editor ---------- */
    .editor-body {
      flex: 1;
      display: flex;
      position: relative;
      min-height: 0;
      background: var(--editor-bg);
    }

    :root { --lh: 22px; --pad-y: 12px; }

    .gutter {
      flex: none;
      overflow: hidden;
      background: var(--gutter-bg);
      border-right: 1px solid var(--border);
      user-select: none;
      -webkit-user-select: none;
      position: relative;
    }
    .gutter-inner { padding: var(--pad-y) 0; will-change: transform; }

    .ln {
      height: var(--lh);
      line-height: var(--lh);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 10px 0 6px;
      font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace;
      font-size: 13px;
      color: var(--gutter-text);
      cursor: pointer;
      position: relative;
      gap: 8px;
    }
    .ln .bp {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: transparent;
      flex: none;
      transition: background .1s, transform .1s;
    }
    .ln:hover .bp { background: rgba(248, 81, 73, 0.35); }
    .ln.pinned .bp { background: var(--pin-dot); box-shadow: 0 0 0 2px rgba(248, 81, 73, 0.25); }
    .ln.pinned { color: var(--text-strong); }
    .ln.current { color: var(--text-strong); }

    .edit-area { position: relative; flex: 1; min-width: 0; }

    .code-font {
      font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace;
      font-size: 14px;
      line-height: var(--lh);
      tab-size: 2;
      -moz-tab-size: 2;
      white-space: pre;
    }

    .mirror {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      color: transparent;
    }
    .mirror-inner { padding: var(--pad-y) 16px; width: max-content; min-width: 100%; }
    .mirror .row { height: var(--lh); width: 100%; min-width: 100%; }
    .mirror .row.pinned { background: var(--pin-bg); box-shadow: inset 3px 0 0 var(--pin-dot); }
    .mirror .row.current:not(.pinned) { background: var(--caret-line); }
    .mirror mark { background: var(--match); color: transparent; border-radius: 2px; }
    .mirror mark.cur { background: var(--match-current); }
    .mirror .spacer { height: 60px; width: 60px; }

    #code {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      color: var(--text-strong);
      padding: var(--pad-y) 16px;
      resize: none;
      outline: none;
      overflow: auto;
      caret-color: var(--text-strong);
    }
    #code::placeholder { color: var(--faint); }

    .statusbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 4px 12px;
      background: var(--panel-2);
      border-top: 1px solid var(--border);
      font-size: 11.5px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .statusbar .grow { flex: 1; }
    .statusbar .pins { display: inline-flex; align-items: center; gap: 5px; }
    .statusbar .pins i { width: 8px; height: 8px; border-radius: 50%; background: var(--pin-dot); display: inline-block; }

    /* ---------- Preview ---------- */
    .reload-badge {
      background: var(--btn);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 11px;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    iframe { flex: 1; width: 100%; background: #ffffff; border: none; display: block; min-height: 0; }

    /* ---------- Scrollbars ---------- */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--editor-bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--faint); }
    ::-webkit-scrollbar-corner { background: var(--editor-bg); }

    @media (max-width: 700px) {
      .compiler { flex-direction: column; padding: 8px; gap: 8px; }
      .pane { min-height: 250px; }
      .btn .label { display: none; }
      .header .right .hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">
      <span style="color: var(--accent);">⚡</span> Live Compiler
      <i class="tag">HTML · CSS · JS</i>
    </span>
    <span class="right">
      <span class="hint">Ctrl+F search · click line number to pin</span>
      <button class="btn" id="themeBtn" aria-label="Toggle theme" title="Toggle light / dark theme">
        <span id="themeIcon"></span>
        <span class="label" id="themeLabel">Light</span>
      </button>
    </span>
  </div>

  <div class="compiler">
    <!-- LEFT: code area -->
    <div class="pane" id="editorPane">
      <div class="pane-header">
        <div class="left">
          <span class="dot"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
          <span style="margin-left: 6px;">index.html</span>
        </div>
        <div class="actions">
          <button class="btn" id="clearPinsBtn" title="Remove all pinned lines">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6M14 11v6"></path></svg>
            <span class="label">Clear pins</span>
          </button>
          <button class="btn" id="copyBtn" aria-label="Copy code">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span class="label">Copy</span>
          </button>
          <button class="btn icon fs-btn" data-target="editorPane" title="Full screen (Esc to exit)" aria-label="Full screen code"></button>
        </div>
      </div>

      <!-- Search -->
      <div class="searchbar">
        <div class="field">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input id="search" type="text" placeholder="Search in code…" autocomplete="off" spellcheck="false">
          <span id="searchCount"></span>
        </div>
        <button class="btn icon" id="caseBtn" title="Match case" aria-label="Match case" style="font-weight:700;">Aa</button>
        <button class="btn icon" id="prevBtn" title="Previous (Shift+Enter)" aria-label="Previous match">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
        </button>
        <button class="btn icon" id="nextBtn" title="Next (Enter)" aria-label="Next match">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
      </div>

      <div class="editor-body">
        <div class="gutter code-font" id="gutter"><div class="gutter-inner" id="gutterInner"></div></div>
        <div class="edit-area">
          <div class="mirror code-font" id="mirror"><div class="mirror-inner" id="mirrorInner"></div></div>
          <textarea id="code" class="code-font" spellcheck="false" wrap="off" placeholder="Write your HTML, CSS, and JS here..."></textarea>
        </div>
      </div>

      <div class="statusbar">
        <span id="pos">Ln 1, Col 1</span>
        <span id="lineTotal">1 line</span>
        <span class="grow"></span>
        <span class="pins"><i></i><span id="pinCount">0 pinned</span></span>
      </div>
    </div>

    <!-- RIGHT: live preview -->
    <div class="pane" id="previewPane">
      <div class="pane-header">
        <span>🌐 Preview</span>
        <div class="actions">
          <span class="reload-badge">auto‑refresh</span>
          <button class="btn icon fs-btn" data-target="previewPane" title="Full screen (Esc to exit)" aria-label="Full screen preview"></button>
        </div>
      </div>
      <iframe id="preview" title="Live preview" sandbox="allow-scripts allow-modals allow-popups allow-forms allow-same-origin"></iframe>
    </div>
  </div>

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const codeEl = $('code');
      const previewEl = $('preview');
      const copyBtn = $('copyBtn');
      const gutter = $('gutter');
      const gutterInner = $('gutterInner');
      const mirror = $('mirror');
      const mirrorInner = $('mirrorInner');
      const searchEl = $('search');
      const searchCount = $('searchCount');
      const caseBtn = $('caseBtn');
      const LH = 22;

      /* ===================== THEME ===================== */
      const sunSVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';
      const moonSVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';

      function applyTheme(t) {
        document.documentElement.setAttribute('data-theme', t);
        $('themeIcon').innerHTML = t === 'dark' ? sunSVG : moonSVG;
        $('themeLabel').textContent = t === 'dark' ? 'Light' : 'Dark';
        try { localStorage.setItem('est-compiler-theme', t); } catch (e) {}
      }
      let savedTheme = 'dark';
      try { savedTheme = localStorage.getItem('est-compiler-theme') || 'dark'; } catch (e) {}
      applyTheme(savedTheme);
      $('themeBtn').addEventListener('click', () => {
        applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
      });

      /* ===================== FULLSCREEN ===================== */
      const expandSVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>';
      const shrinkSVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"></polyline><polyline points="20 10 14 10 14 4"></polyline><line x1="14" y1="10" x2="21" y2="3"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>';

      document.querySelectorAll('.fs-btn').forEach((b) => (b.innerHTML = expandSVG));

      function setFullscreen(pane, on) {
        pane.classList.toggle('fs', on);
        const btn = pane.querySelector('.fs-btn');
        btn.innerHTML = on ? shrinkSVG : expandSVG;
        btn.classList.toggle('active', on);
        if (pane.id === 'editorPane') { render(); syncScroll(); }
      }
      document.querySelectorAll('.fs-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const pane = $(btn.dataset.target);
          setFullscreen(pane, !pane.classList.contains('fs'));
        });
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          document.querySelectorAll('.pane.fs').forEach((p) => setFullscreen(p, false));
        }
      });

      /* ===================== DEFAULT CODE ===================== */
      const defaultCode = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #0b1120, #1a2639);
      font-family: system-ui, sans-serif;
      padding: 16px;
    }
    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
      border-radius: 32px;
      padding: 40px 32px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 25px 40px -12px rgba(0,0,0,0.6);
      color: white;
      max-width: 480px;
      width: 100%;
    }
    h1 {
      font-weight: 500;
      font-size: 2rem;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      background: linear-gradient(to right, #a5d8ff, #b197fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p {
      color: #b0c4de;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    button {
      background: #3b82f6;
      border: none;
      color: white;
      font-weight: 600;
      padding: 12px 32px;
      border-radius: 40px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 8px 18px -6px #3b82f6;
    }
    button:hover {
      background: #2563eb;
      transform: scale(1.02);
    }
    .counter {
      font-size: 1.3rem;
      margin-top: 18px;
      color: #a5d8ff;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>✨ Live Compiler</h1>
    <p>Left: code · Right: live preview</p>
    <button id="clickBtn">Click me</button>
    <div class="counter" id="counter">0 clicks</div>
  </div>
  <script>
    let count = 0;
    const btn = document.getElementById('clickBtn');
    const counter = document.getElementById('counter');
    btn.addEventListener('click', () => {
      count++;
      counter.textContent = count + (count === 1 ? ' click' : ' clicks');
      btn.style.background = '#8b5cf6';
      setTimeout(() => btn.style.background = '#3b82f6', 200);
    });
  <\/script>
</body>
</html>`;

      codeEl.value = defaultCode;

      /* ===================== STATE ===================== */
      let pins = new Set();          // zero-based line indexes
      let matches = [];              // {line, col, len, start}
      let currentMatch = -1;
      let caseSensitive = false;
      let pre = { count: 1, startPos: 0, startLine: 0, startCol: 0 };

      /* ===================== HELPERS ===================== */
      function esc(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function lineColOf(text, pos) {
        const before = text.slice(0, pos);
        const line = before.split('\n').length - 1;
        const col = pos - (before.lastIndexOf('\n') + 1);
        return { line, col };
      }

      let charW = 8.4;
      function measureChar() {
        const c = document.createElement('canvas').getContext('2d');
        const cs = getComputedStyle(codeEl);
        c.font = cs.fontSize + ' ' + cs.fontFamily;
        charW = c.measureText('M').width || 8.4;
      }

      /* ===================== SEARCH ===================== */
      function computeMatches(text) {
        matches = [];
        const q = searchEl.value.replace(/\n/g, '');
        if (!q) { currentMatch = -1; return; }
        const hay = caseSensitive ? text : text.toLowerCase();
        const needle = caseSensitive ? q : q.toLowerCase();
        const lines = text.split('\n');
        let offset = 0;
        for (let li = 0; li < lines.length; li++) {
          const lh = caseSensitive ? lines[li] : lines[li].toLowerCase();
          let idx = 0;
          while ((idx = lh.indexOf(needle, idx)) !== -1) {
            matches.push({ line: li, col: idx, len: q.length, start: offset + idx });
            idx += Math.max(1, q.length);
          }
          offset += lines[li].length + 1;
        }
        if (currentMatch >= matches.length) currentMatch = matches.length - 1;
      }

      function updateSearchCount() {
        if (!searchEl.value) { searchCount.textContent = ''; searchCount.classList.remove('none'); return; }
        if (!matches.length) { searchCount.textContent = 'No results'; searchCount.classList.add('none'); return; }
        searchCount.classList.remove('none');
        searchCount.textContent = (currentMatch >= 0 ? currentMatch + 1 : 0) + ' / ' + matches.length;
      }

      function goToMatch(i) {
        if (!matches.length) return;
        currentMatch = (i + matches.length) % matches.length;
        const m = matches[currentMatch];
        render();
        const top = m.line * LH;
        codeEl.scrollTop = Math.max(0, top - codeEl.clientHeight / 2 + LH);
        const x = m.col * charW;
        codeEl.scrollLeft = x > codeEl.clientWidth - 120 ? Math.max(0, x - codeEl.clientWidth / 2) : 0;
        syncScroll();
        updateSearchCount();
      }

      function nextMatch(dir) {
        if (!matches.length) return;
        if (currentMatch === -1) {
          // start from caret position
          const pos = codeEl.selectionStart;
          let idx = matches.findIndex((m) => m.start >= pos);
          if (dir < 0) idx = (idx === -1 ? matches.length : idx) - 1;
          if (idx === -1) idx = 0;
          goToMatch(idx);
        } else {
          goToMatch(currentMatch + dir);
        }
      }

      searchEl.addEventListener('input', () => {
        currentMatch = -1;
        render();
        if (matches.length) {
          const pos = codeEl.selectionStart;
          let idx = matches.findIndex((m) => m.start >= pos);
          goToMatch(idx === -1 ? 0 : idx);
        }
      });
      searchEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); nextMatch(e.shiftKey ? -1 : 1); }
        if (e.key === 'Escape') { searchEl.blur(); codeEl.focus(); }
      });
      $('nextBtn').addEventListener('click', () => nextMatch(1));
      $('prevBtn').addEventListener('click', () => nextMatch(-1));
      caseBtn.addEventListener('click', () => {
        caseSensitive = !caseSensitive;
        caseBtn.classList.toggle('active', caseSensitive);
        currentMatch = -1;
        render();
      });

      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
          e.preventDefault();
          const sel = codeEl.value.slice(codeEl.selectionStart, codeEl.selectionEnd);
          if (sel && !sel.includes('\n')) { searchEl.value = sel; }
          searchEl.focus();
          searchEl.select();
          currentMatch = -1;
          render();
        }
      });

      /* ===================== RENDER (gutter + mirror) ===================== */
      function render() {
        const text = codeEl.value;
        const lines = text.split('\n');
        computeMatches(text);

        const caretLine = lineColOf(text, codeEl.selectionStart).line;

        // group matches by line
        const byLine = new Map();
        matches.forEach((m, i) => {
          if (!byLine.has(m.line)) byLine.set(m.line, []);
          byLine.get(m.line).push({ m, i });
        });

        // gutter width
        const digits = Math.max(3, String(lines.length).length);
        gutter.style.width = (digits * 8.6 + 52) + 'px';

        let g = '';
        let r = '';
        for (let i = 0; i < lines.length; i++) {
          const pinned = pins.has(i);
          const cur = i === caretLine;
          g += '<div class="ln' + (pinned ? ' pinned' : '') + (cur ? ' current' : '') + '" data-line="' + i + '"><span class="bp"></span><span>' + (i + 1) + '</span></div>';

          let content = '';
          const ms = byLine.get(i);
          if (ms) {
            let last = 0;
            const line = lines[i];
            ms.forEach(({ m, i: mi }) => {
              content += esc(line.slice(last, m.col));
              content += '<mark' + (mi === currentMatch ? ' class="cur"' : '') + '>' + esc(line.slice(m.col, m.col + m.len)) + '</mark>';
              last = m.col + m.len;
            });
            content += esc(line.slice(last));
          } else {
            content = esc(lines[i]);
          }
          r += '<div class="row' + (pinned ? ' pinned' : '') + (cur ? ' current' : '') + '">' + content + '</div>';
        }
        r += '<div class="spacer"></div>';
        gutterInner.innerHTML = g;
        mirrorInner.innerHTML = r;

        $('lineTotal').textContent = lines.length + (lines.length === 1 ? ' line' : ' lines');
        $('pinCount').textContent = pins.size + ' pinned';
        updatePos();
        updateSearchCount();
        syncScroll();
      }

      function updatePos() {
        const { line, col } = lineColOf(codeEl.value, codeEl.selectionStart);
        $('pos').textContent = 'Ln ' + (line + 1) + ', Col ' + (col + 1);
      }

      function syncScroll() {
        gutterInner.style.transform = 'translateY(' + (-codeEl.scrollTop) + 'px)';
        mirror.scrollTop = codeEl.scrollTop;
        mirror.scrollLeft = codeEl.scrollLeft;
      }
      codeEl.addEventListener('scroll', syncScroll);

      // light-weight caret-line refresh
      let lastCaretLine = -1;
      function onCaretMove() {
        const l = lineColOf(codeEl.value, codeEl.selectionStart).line;
        updatePos();
        if (l !== lastCaretLine) { lastCaretLine = l; render(); }
      }
      ['keyup', 'click', 'focus'].forEach((ev) => codeEl.addEventListener(ev, onCaretMove));
      document.addEventListener('selectionchange', () => {
        if (document.activeElement === codeEl) onCaretMove();
      });

      /* ===================== PINNED LINES ===================== */
      gutter.addEventListener('click', (e) => {
        const row = e.target.closest('.ln');
        if (!row) return;
        const i = parseInt(row.dataset.line, 10);
        if (pins.has(i)) pins.delete(i); else pins.add(i);
        render();
      });
      $('clearPinsBtn').addEventListener('click', () => { pins.clear(); render(); });

      // Keep pins attached to their code when lines are added / removed
      function recordPre(inputType) {
        const text = codeEl.value;
        let s = codeEl.selectionStart;
        if (codeEl.selectionStart === codeEl.selectionEnd) {
          if (inputType === 'deleteContentBackward') s = Math.max(0, s - 1);
        }
        const lc = lineColOf(text, s);
        pre = { count: text.split('\n').length, startPos: s, startLine: lc.line, startCol: lc.col };
      }
      codeEl.addEventListener('beforeinput', (e) => recordPre(e.inputType));

      function adjustPins() {
        const newCount = codeEl.value.split('\n').length;
        const delta = newCount - pre.count;
        if (delta === 0 || pins.size === 0) return;
        const next = new Set();
        pins.forEach((p) => {
          if (delta > 0) {
            const boundary = pre.startCol === 0 ? pre.startLine : pre.startLine + 1;
            next.add(p >= boundary ? p + delta : p);
          } else {
            const removed = -delta;
            const from = pre.startLine + 1;
            const to = pre.startLine + removed;
            if (p >= from && p <= to) return;      // line was deleted
            next.add(p > to ? p - removed : p);
          }
        });
        pins = next;
      }

      /* ===================== LIVE PREVIEW ===================== */
      function updatePreview() {
        const iframeDoc = previewEl.contentDocument || previewEl.contentWindow.document;
        iframeDoc.open();
        iframeDoc.write(codeEl.value);
        iframeDoc.close();
      }

      let debounceTimer;
      function debouncedUpdate() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(updatePreview, 150);
      }

      codeEl.addEventListener('input', () => {
        adjustPins();
        render();
        debouncedUpdate();
      });

      /* ===================== COPY ===================== */
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(codeEl.value);
        } catch (err) {
          codeEl.select();
          document.execCommand('copy');
          window.getSelection().removeAllRanges();
        }
        const originalHTML = copyBtn.innerHTML;
        copyBtn.classList.add('copied');
        copyBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg><span class="label">Copied!</span>';
        setTimeout(() => {
          copyBtn.classList.remove('copied');
          copyBtn.innerHTML = originalHTML;
        }, 1800);
      });

      /* ===================== TAB KEY ===================== */
      codeEl.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
          e.preventDefault();
          recordPre('insertText');
          const ok = document.execCommand && document.execCommand('insertText', false, '  ');
          if (!ok) {
            const start = codeEl.selectionStart;
            const end = codeEl.selectionEnd;
            codeEl.value = codeEl.value.substring(0, start) + '  ' + codeEl.value.substring(end);
            codeEl.selectionStart = codeEl.selectionEnd = start + 2;
            codeEl.dispatchEvent(new Event('input'));
          }
        }
      });

      /* ===================== INIT ===================== */
      measureChar();
      render();
      updatePreview();
      window.addEventListener('resize', () => { measureChar(); syncScroll(); });
    })();
  </script>
</body>
</html>
