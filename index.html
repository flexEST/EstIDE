<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EST HTML Complier</title>
  <style>
    /* Global reset & full height */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      background: #0d1117;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Simple header with subtle hint */
    .header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #c9d1d9;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }

    .header span {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header i {
      font-style: normal;
      background: #21262d;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 12px;
      color: #8b949e;
      border: 1px solid #30363d;
    }

    /* Main split layout */
    .compiler {
      display: flex;
      flex: 1;
      overflow: hidden;
      padding: 12px;
      gap: 12px;
      background: #0d1117;
    }

    /* Left side – code editor */
    .editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #161b22;
      border-radius: 12px;
      border: 1px solid #30363d;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      min-width: 0; /* prevent flex overflow */
    }

    .editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #1c2128;
      border-bottom: 1px solid #30363d;
      color: #c9d1d9;
      font-size: 13px;
      font-weight: 500;
    }

    .editor-header .left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f78166;
      display: inline-block;
    }

    .dot.green {
      background: #3fb950;
    }

    .dot.yellow {
      background: #d29922;
    }

    /* Copy button */
    .copy-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 5px 12px;
      border-radius: 24px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .copy-btn:hover {
      background: #30363d;
      border-color: #8b949e;
      color: #ffffff;
    }

    .copy-btn:active {
      transform: scale(0.96);
    }

    .copy-btn.copied {
      background: #238636;
      border-color: #2ea043;
      color: white;
    }

    /* Textarea for code */
    #code {
      width: 100%;
      flex: 1;
      background: #0d1117;
      border: none;
      color: #e6edf3;
      font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
      font-size: 14px;
      line-height: 1.6;
      padding: 16px;
      resize: none;
      outline: none;
      tab-size: 2;
      white-space: pre;
      overflow: auto;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
    }

    #code::placeholder {
      color: #484f58;
    }

    /* Right side – live preview */
    .preview-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #161b22;
      border-radius: 12px;
      border: 1px solid #30363d;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      min-width: 0;
    }

    .preview-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      background: #1c2128;
      border-bottom: 1px solid #30363d;
      color: #c9d1d9;
      font-size: 13px;
      font-weight: 500;
    }

    .preview-header .reload-badge {
      background: #21262d;
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 11px;
      color: #8b949e;
      margin-left: auto;
    }

    iframe {
      flex: 1;
      width: 100%;
      background: #ffffff;
      border: none;
      display: block;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #0d1117;
    }

    ::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 8px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #484f58;
    }

    /* Small screens: stack? but we keep side-by-side — fine */
    @media (max-width: 700px) {
      .compiler {
        flex-direction: column;
      }
      .editor-pane, .preview-pane {
        min-height: 250px;
      }
    }

    /* font awesome fallback for copy icon (we use SVG inline) */
  </style>
</head>
<body>
  <div class="header">
    <span>
      <span style="color: #58a6ff;">⚡</span> Live Compiler
      <i>HTML · CSS · JS</i>
    </span>
    <span style="font-size: 12px; color: #8b949e;">edit → reload</span>
  </div>

  <div class="compiler">
    <!-- LEFT: code area -->
    <div class="editor-pane">
      <div class="editor-header">
        <div class="left">
          <span class="dot"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
          <span style="margin-left: 6px;">index.html</span>
        </div>
        <!-- COPY BUTTON with inline SVG icon -->
        <button class="copy-btn" id="copyBtn" aria-label="Copy code">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span>Copy</span>
        </button>
      </div>
      <textarea id="code" spellcheck="false" placeholder="Write your HTML, CSS, and JS here..."></textarea>
    </div>

    <!-- RIGHT: live preview -->
    <div class="preview-pane">
      <div class="preview-header">
        <span>🌐 Preview</span>
        <span class="reload-badge">auto‑refresh</span>
      </div>
      <iframe id="preview" title="Live preview" sandbox="allow-scripts allow-modals allow-popups allow-forms allow-same-origin"></iframe>
    </div>
  </div>

  <script>
    (function() {
      const codeEl = document.getElementById('code');
      const previewEl = document.getElementById('preview');
      const copyBtn = document.getElementById('copyBtn');

      // 1. DEFAULT CODE — a nice starting example
      const defaultCode = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #0b1120, #1a2639);
      font-family: system-ui, sans-serif;
      padding: 16px;
    }
    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
      border-radius: 32px;
      padding: 40px 32px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 25px 40px -12px rgba(0,0,0,0.6);
      color: white;
      max-width: 480px;
      width: 100%;
    }
    h1 {
      font-weight: 500;
      font-size: 2rem;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      background: linear-gradient(to right, #a5d8ff, #b197fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p {
      color: #b0c4de;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    button {
      background: #3b82f6;
      border: none;
      color: white;
      font-weight: 600;
      padding: 12px 32px;
      border-radius: 40px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 8px 18px -6px #3b82f6;
    }
    button:hover {
      background: #2563eb;
      transform: scale(1.02);
    }
    .counter {
      font-size: 1.3rem;
      margin-top: 18px;
      color: #a5d8ff;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>✨ Live Compiler</h1>
    <p>Left: code · Right: live preview</p>
    <button id="clickBtn">Click me</button>
    <div class="counter" id="counter">0 clicks</div>
  </div>
  <script>
    let count = 0;
    const btn = document.getElementById('clickBtn');
    const counter = document.getElementById('counter');
    btn.addEventListener('click', () => {
      count++;
      counter.textContent = count + (count === 1 ? ' click' : ' clicks');
      btn.style.background = '#8b5cf6';
      setTimeout(() => btn.style.background = '#3b82f6', 200);
    });
  <\/script>
</body>
</html>`;

      // Set initial code
      codeEl.value = defaultCode;

      // 2. FUNCTION: update preview with code (safely inject)
      function updatePreview() {
        const code = codeEl.value;
        const iframeDoc = previewEl.contentDocument || previewEl.contentWindow.document;
        iframeDoc.open();
        iframeDoc.write(code);
        iframeDoc.close();
      }

      // 3. DEBOUNCE (prevent too many reloads while typing)
      let debounceTimer;
      function debouncedUpdate() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          updatePreview();
        }, 150); // 150ms after last keystroke
      }

      // 4. LISTEN FOR INPUT (typing, paste, cut, etc.)
      codeEl.addEventListener('input', debouncedUpdate);

      // 5. INITIAL RENDER
      updatePreview();

      // 6. COPY FUNCTIONALITY
      copyBtn.addEventListener('click', async () => {
        const codeToCopy = codeEl.value;

        try {
          // modern clipboard API
          await navigator.clipboard.writeText(codeToCopy);
        } catch (err) {
          // fallback for older browsers / iframes
          codeEl.select();
          document.execCommand('copy');
          window.getSelection().removeAllRanges();
        }

        // visual feedback
        const originalHTML = copyBtn.innerHTML;
        copyBtn.classList.add('copied');
        copyBtn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          <span>Copied!</span>
        `;

        setTimeout(() => {
          copyBtn.classList.remove('copied');
          copyBtn.innerHTML = originalHTML;
        }, 1800);
      });

      // 7. (optional) Tab key inserts two spaces instead of moving focus
      codeEl.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
          e.preventDefault();
          const start = codeEl.selectionStart;
          const end = codeEl.selectionEnd;
          codeEl.value = codeEl.value.substring(0, start) + '  ' + codeEl.value.substring(end);
          codeEl.selectionStart = codeEl.selectionEnd = start + 2;
          // trigger input event manually for preview update
          codeEl.dispatchEvent(new Event('input'));
        }
      });

      // Make sure iframe has basic security but allows scripts & same-origin for functionality.
      // sandbox already set in HTML, but if we need to re-apply, it's fine.
      // Also: some previews may need to open links, but this is a simple live preview.

      // small fix: when iframe loads for the first time, ensure it's ready.
      previewEl.addEventListener('load', () => {
        // no extra action needed
      });

    })();
  </script>
</body>
</html>
